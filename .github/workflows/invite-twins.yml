# THE CHECKS THIS REPO HAS. BOTH OF THEM GUARD SOMETHING A READING CANNOT.
#
# JOB 1, twins: the one thing a comment could not.
#
# 404.html and join/index.html render the same invite screen. GitHub Pages serves 404.html for
# every REAL invite URL - /join/<CODE> and /de/join/<CODE> are not files - so join/index.html is
# the copy almost nobody sees. On 2026-08-20 a fix for 16-character codes overflowing a phone
# screen was applied to join/index.html only, verified by fetching /join/, reported as done, and
# never once served to a person holding an invite link. A MIRROR WARNING comment in both files was
# the only thing keeping them in step, and a comment cannot fail.
#
# So: strip the comments (they are deliberately different - 404.html explains the Pages 404 trick
# at greater length) and require the rest to be byte-identical.
#
# NOT COVERED, recorded rather than hidden: de/join/index.html is a third copy of this body, but
# its head is German by design and its <body> carries lang="en" for the no-JS case, so a plain
# diff against the twins is the wrong shape for it. Its German comes from /join.js at runtime,
# which is a single source and cannot drift the way a copied file can.

# THE FILE IS STILL CALLED invite-twins.yml, which is now a name for half of it. Renaming a
# workflow file throws away its run history, and the history of the twins check is the record
# of the defect it exists for. The workflow's NAME says what it covers; the filename is an
# address.
#
# JOB 2, hreflang: the one thing a HUMAN could not. A wrong language alternate shows nobody
# anything - no broken page, no 404, no visible symptom at all - and the way you find out is
# that the German half of the site quietly never ranks. .github/check-hreflang.py is the
# reading, and its own docstring is the argument. Added 2026-08-21 with the EN/DE switcher,
# so that the next locale cannot be wired up wrongly in silence.
#
# WHY IT IS NOT THE SAME COMMAND ON EVERY EVENT. On a pull request the live site is still the
# PREVIOUS deploy, so a PR that adds a locale would be curling urls that cannot exist yet and
# would go red for doing the right thing - and a check that is red for correct work is one
# somebody switches off. So a PR gets the structural half, which is complete and
# deterministic on the files in front of it, and the far side is read after the merge, where
# it can be true. --wait-for-deploy is there because the Pages build races this workflow.

name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Once a week: the live half of the hreflang job is the only thing here that
    # can start failing without anybody pushing anything.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  twins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 404.html and join/index.html must be identical apart from comments
        run: |
          set -euo pipefail
          # Comments go, and so do the blank lines they leave behind: the two files' comment
          # blocks are deliberately different shapes, and a guard that reddens over a blank line
          # is one somebody switches off.
          strip() { perl -0777 -pe 's/<!--.*?-->//gs' "$1" | sed '/^[[:space:]]*$/d'; }
          if diff -u <(strip join/index.html) <(strip 404.html); then
            echo "OK: the invite twins are identical apart from their comments."
          else
            echo
            echo "FAIL: the invite twins have drifted."
            echo "GitHub Pages serves 404.html for every real /join/<CODE> and /de/join/<CODE> URL,"
            echo "so a change that lands only in join/index.html reaches nobody at all."
            echo "Apply the change to BOTH files. The diff above is join/index.html vs 404.html."
            exit 1
          fi

  hreflang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every alternate set must be reciprocal, self-referencing, and live
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request: structural checks only."
            echo "The live site is still the previous deploy, so a page this PR adds cannot"
            echo "answer 200 yet. The far side is read on the push to main that follows."
            python3 .github/check-hreflang.py
          else
            python3 .github/check-hreflang.py --live --wait-for-deploy
          fi
