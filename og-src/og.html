<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  SOURCE for /og.png (the sitewide social preview card), 1200x630.
  Regenerate:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --screenshot=og.png --window-size=1200,630 --hide-scrollbars \
      "file://$(pwd)/og-src/og.html"
  This file exists because the first og.png had no source anywhere: its Pip was a freehand
  redraw (floating roof, detached chimney, wrong body lilac) and the pill text sat left of
  center, and nothing could be fixed without rebuilding from scratch (owner review of the
  first real WhatsApp card, 2026-09-01). The Pip below is the SHIPPED geometry, copied
  verbatim from app/src/components/Pip.tsx (listr repo) with the theme's exact fills.
  Colors are the site tokens from style.css.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #FBF7F1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
  }
  .text { padding-left: 96px; }
  h1 { font-size: 88px; font-weight: 800; color: #3A3350; letter-spacing: -1px; }
  h1 .co { color: #7C5CD6; }
  .tagline { margin-top: 26px; font-size: 46px; font-weight: 700; color: #3A3350; }
  .body { margin-top: 22px; font-size: 29px; line-height: 1.45; color: #6B5F82; white-space: nowrap; }
  .pill {
    margin-top: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #6A4FB0;
    color: #FFFFFF;
    font-size: 27px;
    font-weight: 700;
    border-radius: 999px;
    padding: 16px 40px;
  }
  .pip { position: absolute; right: 82px; top: 50%; transform: translateY(-53%); }
</style>
</head>
<body>
  <div class="text">
    <h1><span class="co">Co</span>Hiro.</h1>
    <div class="tagline">Your home, on the same page.</div>
    <div class="body">One shopping list the whole household can add to,<br>and a picture of what is actually in the cupboard.</div>
    <div class="pill">cohiro.app</div>
  </div>
  <!-- Pip, standard pose: verbatim geometry from app/src/components/Pip.tsx -->
  <svg class="pip" viewBox="0 0 120 120" width="330" height="330">
    <ellipse cx="46" cy="102" rx="9" ry="5" fill="#6E55D6"/>
    <ellipse cx="74" cy="102" rx="9" ry="5" fill="#6E55D6"/>
    <rect x="23" y="29" width="74" height="71" rx="28" fill="#9B8CFF"/>
    <path d="M37 36 L60 15 L83 36 Z" fill="#E0556A"/>
    <rect x="70" y="22" width="7" height="14" rx="1" fill="#C8455A"/>
    <circle cx="42" cy="73" r="4.8" fill="#E0556A" opacity="0.3"/>
    <circle cx="78" cy="73" r="4.8" fill="#E0556A" opacity="0.3"/>
    <circle cx="50" cy="63" r="4.8" fill="#34235E"/>
    <circle cx="70" cy="63" r="4.8" fill="#34235E"/>
    <path d="M51 74 Q60 81 69 74" stroke="#34235E" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  </svg>
</body>
</html>
