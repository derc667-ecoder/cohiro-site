<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  SOURCE for /og-join.png - the INVITE-specific preview card on /join/ and /de/join/, 1200x630.
  Regenerate:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --screenshot=og-join.png --window-size=1200,630 --hide-scrollbars \
      "file://$(pwd)/og-src/og-join.html"
  WHY A SEPARATE CARD (owner review, 2026-09-01): the homepage banner carries its own headline
  and tagline, which then fight the join page's og:title ("You have been invited...") rendered
  right beneath it by every chat app - one card saying two things. This card carries almost no
  words (locale-neutral: one image serves /join/ and /de/join/) and lets the og:title speak.
  The picture IS the message: a second Pip arriving to join the first - a household growing.
  Both Pips are the shipped geometry from app/src/components/Pip.tsx (listr repo): the big one
  in the 'happy' pose (closed smiling eyes, wider smile), the arriving one standard.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #FBF7F1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .wordmark { position: absolute; top: 56px; left: 72px; font-size: 54px; font-weight: 800; color: #3A3350; letter-spacing: -0.5px; }
  .wordmark .co { color: #7C5CD6; }
  .pill {
    position: absolute;
    bottom: 60px;
    left: 72px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #6A4FB0;
    color: #FFFFFF;
    font-size: 27px;
    font-weight: 700;
    border-radius: 999px;
    padding: 16px 40px;
  }
  .duo { position: absolute; right: 100px; bottom: 8px; }
  /* Ground alignment: css bottom + (svgHeight - foot-bottom-px) must match across the two.
     big 430px: 60 + 46.6 = ~107. small 240px: 81 + 26 = 107. */
  .pip-big { position: absolute; right: 230px; bottom: 60px; }
  .pip-small { position: absolute; right: 106px; bottom: 81px; }
</style>
</head>
<body>
  <div class="wordmark"><span class="co">Co</span>Hiro.</div>
  <div class="pill">cohiro.app</div>

  <div class="duo" style="width: 560px; height: 560px;">
    <!-- The household Pip, happy pose: geometry from Pip.tsx pose="happy" -->
    <svg class="pip-big" viewBox="0 0 120 120" width="430" height="430">
      <ellipse cx="46" cy="102" rx="9" ry="5" fill="#6E55D6"/>
      <ellipse cx="74" cy="102" rx="9" ry="5" fill="#6E55D6"/>
      <rect x="23" y="29" width="74" height="71" rx="28" fill="#9B8CFF"/>
      <path d="M37 36 L60 15 L83 36 Z" fill="#E0556A"/>
      <rect x="70" y="22" width="7" height="14" rx="1" fill="#C8455A"/>
      <circle cx="42" cy="73" r="4.8" fill="#E0556A" opacity="0.3"/>
      <circle cx="78" cy="73" r="4.8" fill="#E0556A" opacity="0.3"/>
      <path d="M45 64 Q50 58 55 64" stroke="#34235E" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M65 64 Q70 58 75 64" stroke="#34235E" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M49 73 Q60 83 71 73" stroke="#34235E" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    </svg>
    <!-- The arriving Pip: standard pose, the icon-variant deeper lilac so the two read as
         two people, mirrored to face the big one. -->
    <svg class="pip-small" viewBox="0 0 120 120" width="240" height="240" style="transform: scaleX(-1);">
      <ellipse cx="46" cy="102" rx="9" ry="5" fill="#6E55D6"/>
      <ellipse cx="74" cy="102" rx="9" ry="5" fill="#6E55D6"/>
      <rect x="23" y="29" width="74" height="71" rx="28" fill="#8B5CF6"/>
      <path d="M37 36 L60 15 L83 36 Z" fill="#E0556A"/>
      <rect x="70" y="22" width="7" height="14" rx="1" fill="#C8455A"/>
      <circle cx="42" cy="73" r="4.8" fill="#E0556A" opacity="0.3"/>
      <circle cx="78" cy="73" r="4.8" fill="#E0556A" opacity="0.3"/>
      <circle cx="50" cy="63" r="4.8" fill="#34235E"/>
      <circle cx="70" cy="63" r="4.8" fill="#34235E"/>
      <path d="M51 74 Q60 81 69 74" stroke="#34235E" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
</body>
</html>
